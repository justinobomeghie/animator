name: Deploy Animator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Gleam
        uses: erlef/setup-beam@v1
        with:
          gleam-version: "1.19.2"
          otp-version: "27"
          rebar3-version: "3"

      - name: Download dependencies
        run: gleam deps download

      - name: Build application
        run: gleam build

      - name: Bundle website
        run: gleam dev publish

      - name: Upload GitHub Pages files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
